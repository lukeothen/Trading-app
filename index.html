<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#202321">
<meta name="apple-mobile-web-app-title" content="FENCE MATE">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>FENCE MATE — Fencing Toolkit</title>
<style>
:root{--ink:#202321;--paper:#f4f4f1;--line:#d8dbd4;--muted:#687067;--accent:#ff8a35}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--ink);color:white;padding:16px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border:1px solid #858b82;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--accent)}
header b{font-size:20px}
header small{display:block;color:#c9cec7;font-size:10px;letter-spacing:1.5px}
main{max-width:760px;margin:auto;padding:18px 15px 45px}
h1{font-size:29px;line-height:1.15;margin:8px 0}
p{line-height:1.5}
.muted,.note{color:var(--muted);font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
button{font:inherit;cursor:pointer}
.actions button,.primary{background:#252925;color:white;border:0;border-radius:11px;padding:15px;font-weight:700;font-size:15px}
.actions button{text-align:left;min-height:75px}
.actions span{display:block;font-weight:400;font-size:12px;margin-top:5px;color:#d5dad3}
.card{background:white;border:1px solid #dedfd9;border-radius:13px;padding:15px;margin:12px 0}
label{display:block;font-weight:650;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cdd1c9;border-radius:9px;font:inherit;background:white;color:var(--ink)}
textarea{min-height:85px}
.primary{width:100%;margin-top:12px}
.section{display:none}
.section.active{display:block}
.back{border:0;background:none;padding:6px 0 14px;font-weight:700;color:#51574f}
.result{background:#f0f2ed;border-radius:10px;padding:13px;margin-top:12px;white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}
.smallbtn{padding:8px 12px;border:1px solid #ccc;border-radius:8px;background:white}
.note{margin-top:18px}
.estimate-grid{display:grid;grid-template-columns:1fr 110px 100px;gap:7px;align-items:center}
.estimate-grid input{min-width:0;padding:9px}
.estimate-total{font-size:20px;font-weight:800}
.job-photo{max-width:100%;max-height:220px;border-radius:10px;margin-top:8px}
.item-head{font-size:12px;color:var(--muted)}
.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:9px;align-items:center;font-weight:600}
.choice input{width:18px;height:18px;margin:0}
[hidden]{display:none!important}
@media(max-width:380px){.actions{grid-template-columns:1fr}.choice-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="logo">F</div>
<div><b>FENCE MATE</b><small>YOUR FENCING TOOLKIT</small></div>
</header>
<main>
<section id="home" class="section active">
<p class="muted">YOUR SITE ASSISTANT</p>
<h1>What are we building?</h1>
<p class="muted">Practical fencing calculations, materials and job records.</p>
<div class="actions">
<button data-open="talk">Ask AI Mate<span>Fencing questions and quick maths</span></button>
<button data-open="fence">Build my fence<span>Calculate materials</span></button>
<button data-open="jobs">My jobs<span>Search saved jobs</span></button>
<button data-open="gates">Gate calculator<span>Opening and clearances</span></button>
<button data-open="cutting">Cutting calculator<span>Timber lengths and waste</span></button>
<button data-open="netting">Netting calculator<span>Roll quantities</span></button>
<button data-open="checklist">Site checklist<span>Final quality checks</span></button>
</div>
<div class="card"><b>AI site assistant</b><p class="muted">Live AI replies use your existing Netlify function.</p></div>
</section>
